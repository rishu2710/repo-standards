name: Validate Repo Naming

on:
  push:
  pull_request:

jobs:
  validate-repo-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository name format
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          echo "Repo Name: $REPO_NAME"
          if [[ ! "$REPO_NAME" =~ ^(core|[a-zA-Z0-9]+)-(tnt|ent)-(ui|svc|lib|infra|dataprocessor|ml|agent)-[a-z0-9-]+$ ]]; then
            echo "❌ ERROR: Repository name '$REPO_NAME' does not follow naming convention."
            exit 1
          fi
