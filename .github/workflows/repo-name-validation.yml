name: Validate Repo Naming

on:
  push:
  pull_request:

jobs:
  validate-repo-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository name format
        run: |
          # Get only the repo name without org/user prefix
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          
          echo "🔎 Full repository path: $GITHUB_REPOSITORY"
          echo "📦 Extracted repository name: $REPO_NAME"

          # Validate against naming convention
          if [[ ! "$REPO_NAME" =~ ^(core|[a-zA-Z0-9]+)-(tnt|ent)-(ui|svc|lib|infra|dataprocessor|ml|agent)-[a-z0-9-]+$ ]]; then
