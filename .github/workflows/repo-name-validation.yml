name: Validate Repo Naming

on:
  push:
  pull_request:

jobs:
  validate-repo-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository name format
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          echo "🔎 Full repository path: $GITHUB_REPOSITORY"
          echo "📦 Extracted repository name: $REPO_NAME"

          REGEX='^(core|aiops|do|prog)-(tnt|ent)-(ui|svc|lib|infra|dataprocessor|ml|agent)-[a-z0-9-]+$'
          echo "📏 Using regex: $REGEX"

          if [[ ! $REPO_NAME =~ $REGEX ]]; then
            echo "❌ ERROR: Repository name '$REPO_NAME' does not follow naming convention."
            exit 1
          else
            echo "✅ Repository name '$REPO_NAME' is valid."
          fi
